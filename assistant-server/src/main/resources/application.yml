spring:
  application:
    name: myyuyin-assistant-server
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:myyuyinzhushou}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 1
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/plain,audio/wav
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

assistant:
  stt:
    model-path: ${VOSK_MODEL_PATH:/opt/vosk-model-small-cn}
    sample-rate: 16000
  tts:
    executable: ${ESPEAK_NG_PATH:espeak-ng}
    output-directory: ${TTS_OUTPUT_DIR:${java.io.tmpdir}/myyuyin-tts}
  web:
    allowed-origins: ${ALLOWED_ORIGINS:*}

logging:
  level:
    root: INFO
    com.myyuyin.assistant: INFO
