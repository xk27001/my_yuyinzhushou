manifestVersion: 1
id: myyuyin-assistant
name: 语音交互助手
tagline: 离线语音识别、播报与循环闹钟
category: automation
version: "1.0.2"
port: 8080
description: >-
  三角洲语音交互助手由 Java 服务端和客户端组成。


  服务端部署在 ARM64 树莓派 Umbrel，负责 Vosk 离线语音识别、eSpeak NG 语音合成、
  MySQL 持久化、手工命令解析、循环闹钟和实时事件推送。


  客户端运行在有麦克风的电脑上，负责录音、播放、运行状态监控、参数调整和实时报警提示。
developer: xk27001
website: https://github.com/xk27001/my_yuyinzhushou
