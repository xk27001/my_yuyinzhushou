submission: https://github.com/xk27001/my_yuyinzhushou
repo: https://github.com/xk27001/my_yuyinzhushou
support: https://github.com/xk27001/my_yuyinzhushou/issues
icon: https://github.com/xk27001/my_yuyinzhushou/raw/main/myyuyin-assistant/icon.svg
gallery: []
releaseNotes: >-
  1.0.2：修复 Umbrel 2.0 镜像引用和应用代理变量，改用内置 MySQL 8.4，树莓派可一键安装。
