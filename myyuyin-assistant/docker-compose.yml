version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: $APP_MYYUYIN_ASSISTANT_HOST
      APP_PORT: $APP_MYYUYIN_ASSISTANT_PORT
      PROXY_AUTH_ADD: "false"

  db:
    image: mysql:8.4
    user: "1000:1000"
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: myyuyinzhushou
      MYSQL_USER: myyuyin
      MYSQL_PASSWORD: $APP_PASSWORD
      MYSQL_ROOT_PASSWORD: $APP_PASSWORD
    volumes:
      - ${APP_DATA_DIR}/data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  server:
    image: ghcr.io/xk27001/myyuyin-assistant-server:1.0.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: myyuyinzhushou
      DB_USER: myyuyin
      DB_PASSWORD: $APP_PASSWORD
      SERVER_PORT: 8080
      VOSK_MODEL_PATH: /opt/vosk-model-small-cn
      TTS_OUTPUT_DIR: /tmp/myyuyin-tts
      ALLOWED_ORIGINS: "*"
    tmpfs:
      - /tmp/myyuyin-tts
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/vosk-native/libvosk.so && curl -fsS http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
